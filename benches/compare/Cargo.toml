[package]
name = "kalman-compare"
version = "0.0.0"
edition = "2024"
publish = false
description = "Benchmarks of minikalman next to other Rust Kalman filter crates"

# Standalone: not part of the minikalman workspace.
[workspace]

[dependencies]
num-traits = { version = "0.2", features = ["std"] }
minikalman = { path = "../../crates/minikalman", default-features = false, features = ["std"] }
kfilter = { version = "=0.5.1", features = ["std"] }
smelly = "=0.2.0"
kalman_filters = { version = "=1.0.1", default-features = false, features = ["std", "nalgebra"] }
na34 = { package = "nalgebra", version = "0.34", default-features = false, features = ["std"] }
na35 = { package = "nalgebra", version = "0.35", default-features = false, features = ["std", "alloc"] }

[dev-dependencies]
criterion = { version = "0.5.1", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "compare"
harness = false

[profile.release]
codegen-units = 1
lto = "fat"
debug = "line-tables-only"
panic = "unwind"

[profile.bench]
inherits = "release"
