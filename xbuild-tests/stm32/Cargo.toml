[package]
name = "stm32"
publish = false
version.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
default = ["kalman-fixed", "kalman-float"]
# `unsafe` builds the vsqrt.f32 square root (#174), so CI compiles that path.
kalman-float = ["minikalman/libm", "minikalman/unsafe"]
kalman-fixed = ["minikalman/fixed"]

[dependencies]
cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = { version = "0.7.3", features = ["device"] }
embedded-hal = "1.0.0"
lazy_static = { version = "1.4.0", features = ["spin_no_std"] }
minikalman = { version = "*", path = "../../crates/minikalman", default-features = false }
panic-halt = "0.2.0"
static_cell = "2.1.1"
stm32f3 = { version = "0.15.1", features = ["stm32f303"] }
stm32f3xx-hal = { version = "0.10.0", features = ["ld", "rt", "stm32f303xc"] }

[package.metadata.release]
# Cross-build checks only; never released or tagged.
release = false
