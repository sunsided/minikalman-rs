---
name: STM32F303 Cross-Compilation

on:
  push:
    branches: [ "main" ]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'build.rs'
      - 'crates/**'
      - 'xbuild-tests/**'
      - '.github/workflows/embedded-stm32f303.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'build.rs'
      - 'crates/**'
      - 'xbuild-tests/**'
      - '.github/workflows/embedded-stm32f303.yml'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: xbuild-tests/stm32

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    continue-on-error: true  # Allow for the cross-builds
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --no-self-update --component rust-src --target thumbv7em-none-eabihf
          rustup default stable
      - name: Check format
        run: cargo fmt --check
      - name: Check
        run: cargo check
      - name: Clippy
        run: cargo clippy
      - name: Build documentation
        run: cargo doc

  build:
    needs: lint
    name: Build and Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        feature:
          - kalman-float
          - kalman-fixed
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --no-self-update --component rust-src --target thumbv7em-none-eabihf
          rustup default stable
      - name: Build
        run: cargo build --no-default-features --features=${{ matrix.feature }}
