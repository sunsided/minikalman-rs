---
name: GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "Cargo.toml"
      - "crates/minikalman/src/**"
      - "crates/minikalman/Cargo.toml"
      - "xbuild-tests/wasm/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # The workspace release profile keeps debug info for the embedded targets.
  CARGO_PROFILE_RELEASE_DEBUG: "false"
  CARGO_PROFILE_RELEASE_STRIP: "true"

jobs:
  build:
    name: Build the WebAssembly demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --no-self-update --target wasm32-unknown-unknown
          rustup default stable
      - name: Build example module
        run: cargo build --release --package minikalman-wasm --target wasm32-unknown-unknown
      - name: Assemble site
        run: |
          cp target/wasm32-unknown-unknown/release/minikalman_wasm.wasm xbuild-tests/wasm/www/
          node xbuild-tests/wasm/smoke.mjs xbuild-tests/wasm/www/minikalman_wasm.wasm
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: xbuild-tests/wasm/www

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
