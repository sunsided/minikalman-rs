---
name: Test & Fuzz

on:
  push:
    branches: ["main"]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - ".github/workflows/test.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - ".github/workflows/test.yml"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test-stable:
    name: Stable Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        features:
          - ""
          - "--features std"
          - "--no-default-features --features libm,alloc"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: taiki-e/install-action@d042af60014eb018fcd01f57f4f62118b69e3ea6 # nextest
        with:
          tool: nextest
      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Run tests (${{ matrix.features || 'default' }})
        run: cargo nextest run --verbose --package minikalman ${{ matrix.features }}

  fuzz-smoke:
    name: Fuzz Smoke (nightly)
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c76c034f9e32a5d6e2c104dc4df23a22476db04 # nightly
        with:
          toolchain: nightly
      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: nightly-fuzz
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz
      - name: Smoke test matrix_cholesky
        working-directory: crates/minikalman/fuzz
        run: cargo +nightly fuzz run matrix_cholesky -- -runs=100
      - name: Smoke test matrix_mult
        working-directory: crates/minikalman/fuzz
        run: cargo +nightly fuzz run matrix_mult -- -runs=100
      - name: Smoke test regular_filter
        working-directory: crates/minikalman/fuzz
        run: cargo +nightly fuzz run regular_filter -- -runs=100
      - name: Smoke test extended_filter
        working-directory: crates/minikalman/fuzz
        run: cargo +nightly fuzz run extended_filter -- -runs=100
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-crashes
          path: |
            crates/minikalman/fuzz/artifacts/
            crates/minikalman/fuzz/corpus/*/crash-*
            crates/minikalman/fuzz/corpus/*/oom-*
            crates/minikalman/fuzz/corpus/*/timeout-*
          retention-days: 30
