---
name: Test & Fuzz

on:
  push:
    branches: ["main"]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - ".github/workflows/test.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - ".github/workflows/test.yml"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test-stable:
    name: Stable Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        features:
          - ""
          - "--features std"
          - "--no-default-features --features libm,alloc"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: taiki-e/install-action@2409e52fd2fc8a8601d0d900fab9d85ae1fe714a # nextest
        with:
          tool: nextest
      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Run tests (${{ matrix.features || 'default' }})
        run: cargo nextest run --verbose --package minikalman ${{ matrix.features }}

  fuzz-smoke:
    name: Fuzz Smoke (nightly)
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # nightly
        with:
          toolchain: nightly
      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: nightly-fuzz
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz
      - name: Smoke test matrix_cholesky
        working-directory: crates/minikalman/fuzz
        run: cargo +nightly fuzz run matrix_cholesky -- -runs=100
      - name: Smoke test matrix_mult
        working-directory: crates/minikalman/fuzz
        run: cargo +nightly fuzz run matrix_mult -- -runs=100
      - name: Smoke test regular_filter
        working-directory: crates/minikalman/fuzz
        run: cargo +nightly fuzz run regular_filter -- -runs=100
      - name: Smoke test extended_filter
        working-directory: crates/minikalman/fuzz
        run: cargo +nightly fuzz run extended_filter -- -runs=100
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crashes
          path: |
            crates/minikalman/fuzz/artifacts/
            crates/minikalman/fuzz/corpus/*/crash-*
            crates/minikalman/fuzz/corpus/*/oom-*
            crates/minikalman/fuzz/corpus/*/timeout-*
          retention-days: 30
