---
name: Kani

# Proves the fixed-point (`I16F16`) RLS and UD kernels free of overflow, division by zero and
# out-of-bounds access within the input ranges stated in each `#[kani::proof]` (the
# `verification` modules in crates/minikalman/src). Takes about ten minutes.

on:
  push:
    branches: ["main"]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/minikalman/src/**"
      - "crates/minikalman/Cargo.toml"
      - ".github/workflows/kani.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/minikalman/src/**"
      - "crates/minikalman/Cargo.toml"
      - ".github/workflows/kani.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    name: Prove I16F16 kernels
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run the Kani proofs
        uses: model-checking/kani-github-action@f838096619a707b0f6b2118cf435eaccfa33e51f # v1.1
        with:
          kani-version: "0.68.0"
          working-directory: crates/minikalman
          args: --features fixed
