---
name: Rust

on:
  push:
    branches: [ "main" ]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - 'xbuild-tests/**'
      - '.github/workflows/rust.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - 'xbuild-tests/**'
      - '.github/workflows/rust.yml'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy

  docs:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build documentation
        run: cargo doc

  codecov:
    needs: lint
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: cargo build --verbose
      - name: Build Benchmarks
        run: cargo build --benches --package minikalman
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --no-self-update --component llvm-tools-preview
          rustup default stable
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-llvm-cov
      - name: Install nextest
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: nextest
      - name: Generate code coverage
        run: cargo llvm-cov nextest --features=std,fixed,alloc,unsafe,nalgebra --workspace --exclude stm32 --lcov --output-path lcov.info
      - name: Test using libm
        run: cargo nextest run --no-default-features --features=libm,alloc
      - name: Test using micromath
        run: cargo nextest run --no-default-features --features=micromath,alloc
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          # Dependabot and fork PRs get no secrets; fail only when a token is available.
          fail_ci_if_error: ${{ secrets.CODECOV_TOKEN != '' }}

  build-std:
    needs:
      - lint
      - docs
    name: Build and Test (floating-point)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: nextest
      - name: Run Example (float)
        run: cargo run --example=gravity --no-default-features --features=std
      - name: Run EKF example
        run: cargo run --example=radar-2d --no-default-features --features=std
      - name: Run tests (std)
        run: cargo nextest run --verbose --package minikalman --no-default-features --features=std
      - name: Run tests (libm)
        run: cargo nextest run --verbose --package minikalman --no-default-features --features=libm,alloc
      - name: Run doctests
        run: cargo test --doc --verbose --package minikalman --no-default-features --features=std
      - name: Run doctests (libm)
        run: cargo test --doc --verbose --package minikalman --no-default-features --features=std

  build-fixed:
    needs:
      - lint
      - docs
    name: Build and Test (fixed-point)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: nextest
      - name: Run Example (fixed)
        run: cargo run --example=fixed --no-default-features --features=fixed,std
      - name: Run tests (fixed)
        run: cargo nextest run --verbose --package minikalman --no-default-features --features=fixed,std
      - name: Run doctests (fixed)
        run: cargo test --doc --verbose --package minikalman --no-default-features --features=fixed,std

  build-others:
    needs:
      - codecov
      - build-std
      - build-fixed
    name: Build and Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ macos-latest, windows-latest ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: nextest
      - name: Run tests
        run: cargo nextest run --package minikalman --verbose
      - name: Run doctests
        run: cargo test --doc --package minikalman --verbose

  dependencies:
    name: Dependency Submission
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Install cargo-sbom
        uses: psastras/sbom-rs/actions/install-cargo-sbom@9ecc460b937ac5558c4f8ebebc9e07d2bdbef67b # cargo-sbom-v0.10.0

      - name: Generate SBOM
        run: cargo-sbom --output-format=spdx_json_2_3 > sbom.json

      - name: Upload SBOM as artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.json

      - name: Submit dependencies to GitHub
        uses: advanced-security/spdx-dependency-submission-action@b009efcf8b9d562a4569d2028c276522232e631f # v0.4.0
        with:
          filePath: sbom.json