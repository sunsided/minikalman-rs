---
name: WebAssembly

on:
  push:
    branches: ["main"]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/minikalman/src/**"
      - "crates/minikalman/Cargo.toml"
      - "xbuild-tests/wasm/**"
      - ".github/workflows/wasm.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/minikalman/src/**"
      - "crates/minikalman/Cargo.toml"
      - "xbuild-tests/wasm/**"
      - ".github/workflows/wasm.yml"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The workspace release profile keeps debug info for the embedded targets.
  CARGO_PROFILE_RELEASE_DEBUG: "false"
  CARGO_PROFILE_RELEASE_STRIP: "true"

jobs:
  wasm32:
    name: Build and smoke test (wasm32-unknown-unknown)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --no-self-update --target wasm32-unknown-unknown
          rustup default stable
      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Build library (no_std)
        run: cargo build --release --package minikalman --target wasm32-unknown-unknown
      - name: Build example module
        run: cargo build --release --package minikalman-wasm --target wasm32-unknown-unknown
      - name: Smoke test
        run: |
          wasm=target/wasm32-unknown-unknown/release/minikalman_wasm.wasm
          ls -l "$wasm"
          node xbuild-tests/wasm/smoke.mjs "$wasm"
