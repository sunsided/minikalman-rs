[package]
name = "minikalman"
description.workspace = true
version.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
license.workspace = true
edition.workspace = true
readme = "../../README.md"
rust-version.workspace = true

[[bench]]
name = "inversion"
harness = false

[[bench]]
name = "mult"
harness = false

[[bench]]
name = "gravity"
harness = false
required-features = ["alloc"]

[[bench]]
name = "gravity_fixed"
harness = false
required-features = ["fixed", "alloc"]

[[example]]
name = "gravity"
path = "examples/gravity.rs"
required-features = ["std"]

[[example]]
name = "fixed"
path = "examples/gravity_fixed.rs"
required-features = ["fixed", "std"]

[[example]]
name = "car-1d"
path = "examples/car_1d.rs"
required-features = ["std"]

[[example]]
name = "radar-2d"
path = "examples/radar_2d.rs"
required-features = ["std"]

[[example]]
name = "compass"
path = "examples/compass.rs"
required-features = ["std"]

[[example]]
name = "battery-soc"
path = "examples/battery_soc.rs"
required-features = ["std"]

[[example]]
name = "se2-iekf"
path = "examples/se2_iekf.rs"
required-features = ["std"]

[[example]]
name = "radar-2d-ukf"
path = "examples/radar_2d_ukf.rs"
required-features = ["std"]

[[example]]
name = "luenberger"
path = "examples/luenberger.rs"
required-features = ["fixed", "std"]

[[example]]
name = "filter-dsl"
path = "examples/filter_dsl.rs"
required-features = ["std"]

[[example]]
name = "rls-adaptive"
path = "examples/rls_adaptive.rs"
required-features = ["std"]

[[example]]
name = "augmented-state"
path = "examples/augmented_state.rs"
required-features = ["std"]

[[example]]
name = "radar_2d_ukf_builder"
path = "examples/radar_2d_ukf_builder.rs"
# `std` like the other examples: `alloc` alone has no float backend for `f32`.
required-features = ["std"]

[[test]]
name = "simple"
required-features = ["alloc"]

[[test]]
name = "named_vector"
required-features = ["derive", "unsafe"]

[[test]]
name = "proptest_matrix"
required-features = ["std"]

[[test]]
name = "proptest_filter"
required-features = ["std"]

[features]
default = ["libm", "alloc"]
std = ["num-traits/std", "alloc"]
libm = ["dep:libm", "num-traits/libm"]
unsafe = []
fixed = ["dep:fixed", "fixed/num-traits"]
alloc = []
no_assert = []
micromath = ["dep:micromath"]
nalgebra = ["dep:nalgebra"]
# Needs Rust 1.88, above the crate MSRV.
derive = ["dep:uniform-array-derive", "dep:ensure-uniform-type"]

[dependencies]
fixed = { version = "1.24.0", optional = true }
libm = { version = "0.2.8", optional = true }
micromath = { version = "2.1.0", optional = true, features = ["num-traits"] }
nalgebra = { version = "0.33.2", optional = true, default-features = false }
num-traits = { version = "0.2.19", default-features = false }
uniform-array-derive = { version = "1", optional = true }
ensure-uniform-type = { version = "1", optional = true }

[dev-dependencies]
assert_float_eq = "1.1.3"
colored = { version = "2.1.0" }
criterion = "0.5.1"
lazy_static = "1.4.0"
proptest = "1.5"
rand = "0.8.5"
rand_distr = "0.4.3"
static_cell = "2.1.1"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs", "--html-in-header", "docs/mermaid.html"]

[package.metadata.release]
# Turn "## Unreleased" into a dated release section with its link, and open a new
# "## Unreleased" above it, matching the existing changelog format.
pre-release-replacements = [
    { file = "../../CHANGELOG.md", search = "## Unreleased", replace = "## Unreleased\n\n## [{{version}}] - {{date}}\n\n[{{version}}]: https://github.com/sunsided/minikalman-rs/releases/tag/v{{version}}", exactly = 1 },
]
