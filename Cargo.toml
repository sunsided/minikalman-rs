[workspace]
resolver = "3"
members = ["crates/minikalman", "xbuild-tests/stm32", "xbuild-tests/wasm"]
default-members = ["crates/minikalman"]
exclude = ["crates/minikalman/fuzz", "benches/compare", "benches/mcu"]

[workspace.package]
version = "0.9.1"
description = "Allocation-free Kalman filters (EKF, UKF, UD, square-root, smoothers) for desktop and microcontroller, in floating and fixed point"
authors = ["Markus Mayer"]
repository = "https://github.com/sunsided/minikalman-rs"
homepage = "https://sunsided.github.io/minikalman-rs/"
keywords = ["kalman-filter", "state-estimation", "sensor-fusion", "embedded", "fixed-point"]
categories = ["algorithms", "science::robotics", "embedded", "no-std::no-alloc", "aerospace"]
edition = "2024"
rust-version = "1.85.0"
license = "MIT OR Apache-2.0"

[profile.dev]      # Needed for the embedded cross-compilation projects
panic = "abort"

[profile.release]  # Needed for the embedded cross-compilation projects
panic = "abort"
codegen-units = 1  # better optimizations
debug = true       # symbols are nice, and they don't increase the size on Flash
lto = true         # better optimizations
